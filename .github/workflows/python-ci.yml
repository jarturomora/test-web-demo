name: Python CI

# Ejecuta CI en pushes y pull requests hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Entorno Linux estandar para validar el proyecto.
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga el codigo del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Configura la version de Python usada en el pipeline.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Instala dependencias declaradas en requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) Ejecuta la suite de pruebas.
      - name: Run tests
        run: pytest -q
