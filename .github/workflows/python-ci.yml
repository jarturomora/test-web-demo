name: Python CI

# Ejecuta CI en pushes y pull requests hacia main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Entorno Linux estándar para validar el proyecto.
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Configura la versión de Python usada en el pipeline.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Instala dependencias declaradas en requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4) Ejecuta la suite de pruebas.
      - name: Run tests
        run: python -m pytest -q
        env:
          # Garantiza que la raíz del repo esté en el path de imports en CI.
          PYTHONPATH: ${{ github.workspace }}

  deploy_render:
    # Despliega solo en push a main y si las pruebas pasan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Lanza deploy en Render mediante Deploy Hook.
      - name: Trigger Render Deploy Hook
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
