services:
  web:
    # Construye la imagen usando el Dockerfile dentro de docker/.
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # Publica el puerto del contenedor para acceso local en el navegador.
    ports:
      - "5000:5000"

    # Monta el código local para reflejar cambios sin reconstruir imagen.
    volumes:
      - ..:/app

    # Define variables de entorno útiles en desarrollo.
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000

    # Reinicia automáticamente salvo que se detenga manualmente.
    restart: unless-stopped

  test:
    # Reutiliza la misma imagen del proyecto para asegurar paridad de entorno.
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # Servicio opcional: solo se ejecuta cuando se habilita el perfil test.
    profiles:
      - test

    # Monta el código local para que los tests usen el estado actual del repo.
    volumes:
      - ..:/app

    # Comando de pruebas dentro del contenedor.
    command: ["python", "-m", "pytest", "-q"]

    # No reinicia: es un job puntual que termina al finalizar la suite.
    restart: "no"
