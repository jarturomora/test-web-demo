<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operacion completada</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(155deg, #fefae0, #e9edc9);
      color: #1e1b18;
      padding: 24px;
    }

    .panel {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #d5cabd;
      padding: 24px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      animation: fade 0.45s ease-out;
    }

    h1 {
      margin: 0 0 10px;
    }

    p {
      margin: 0 0 18px;
      color: #45413c;
    }

    a {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      color: #9b2226;
    }

    @keyframes fade {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <section class="panel">
    <!-- Vista generica de operacion correcta para reutilizarla en login y registro. -->
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
    <a href="{{ back_url if back_url else '/login' }}">{{ back_label if back_label else 'Volver al formulario' }}</a>
  </section>
</body>
</html>
